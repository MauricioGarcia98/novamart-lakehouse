<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d"><title id="t">Pedidos de bronze a silver</title><desc id="d">Bronze 1.203.610 pedidos, menos 3.599 duplicados, menos 701 en cuarentena, igual a 1.199.310 en silver.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--good:#0ca30c;--crit:#d03b3b;--hatch:#8f2525;--s1:#2a78d6;--skip:#c3c2b7;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;
--axis:#383835;--hatch:#f2a3a3;--s1:#3987e5;--skip:#5a5955}}
.bg{fill:var(--surface)}.t{fill:var(--ink);font-size:17px;font-weight:600}
.st{fill:var(--ink2);font-size:13px}.lab{fill:var(--ink);font-size:13px}
.mut{fill:var(--muted);font-size:12px}.val{fill:var(--ink);font-size:12px;font-weight:600}
.v2{fill:var(--ink2);font-size:12px}.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}.good{fill:var(--good)}.crit{fill:var(--crit)}
.s1{fill:var(--s1)}.skip{fill:var(--skip)}.ann{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3}
</style><rect class="bg" width="900" height="230" rx="8"/><text class="t" x="24" y="34">¿Qué le pasa a un pedido entre bronze y silver?</text><text class="st" x="24" y="56">Conteos reales de la tabla orders · los duplicados se eliminan, los inválidos se apartan sin frenar el pipeline</text><rect x="24" y="84" width="190" height="110" rx="10" fill="none" stroke="var(--axis)"/><text class="v2" x="40" y="110">Bronze</text><text x="40" y="148" style="fill:var(--ink);font-size:28px;font-weight:600">1.203.610</text><text class="mut" x="40" y="174">pedidos tal cual llegaron</text><path d="M218,139 h16 m-6,-5 l6,5 l-6,5" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><rect x="240" y="84" width="190" height="110" rx="10" fill="none" stroke="var(--axis)"/><text class="v2" x="256" y="110">− Duplicados</text><text x="256" y="148" style="fill:var(--ink);font-size:28px;font-weight:600">3.599</text><text class="mut" x="256" y="174">duplicados y re-envíos</text><path d="M434,139 h16 m-6,-5 l6,5 l-6,5" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><rect x="456" y="84" width="190" height="110" rx="10" fill="none" stroke="var(--axis)"/><text class="v2" x="472" y="110">− Cuarentena</text><text x="472" y="148" style="fill:var(--ink);font-size:28px;font-weight:600">701</text><text class="mut" x="472" y="174">online sin cliente (regla)</text><path d="M650,139 h16 m-6,-5 l6,5 l-6,5" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><rect x="672" y="84" width="190" height="110" rx="10" fill="none" stroke="var(--axis)"/><text class="v2" x="688" y="110">Silver</text><text x="688" y="148" style="fill:var(--ink);font-size:28px;font-weight:600">1.199.310</text><text class="mut" x="688" y="174">pedidos limpios y únicos</text></svg>