<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="NovaMart Lakehouse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.55" stop-color="#1c2541"/>
      <stop offset="1" stop-color="#3a1c32"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3621"/>
      <stop offset="0.5" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ffe8a3"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0">
      <stop offset="0" stop-color="#99e9f2"/>
      <stop offset="0.25" stop-color="#cd7f32"/>
      <stop offset="0.5" stop-color="#c0c7d1"/>
      <stop offset="0.75" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#69db7c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .t  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -1px; }
      .sub { font-size: 20px; fill: #c9d1e3; }
      .lbl { font-size: 14px; font-weight: 700; fill: #e9ecef; letter-spacing: 1px; }
      .tag { font-size: 13px; fill: #adb5bd; }
      .in  { opacity: 0; animation: in 1s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s }
      .node { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
      .wire { stroke-dasharray: 8 10; animation: dash 1.2s linear infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.12) } }
      @keyframes dash { to { stroke-dashoffset: -36 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <g class="t">
    <text class="h1 in d1" x="60" y="98" fill="url(#title)">NovaMart Lakehouse</text>
    <text class="sub in d2" x="62" y="136">Proyecto end-to-end en Databricks · Spark + SQL + Delta Lake + Unity Catalog</text>
    <text class="tag in d3" x="62" y="164">350M+ filas · arquitectura medallion · modelo Kimball · SCD2 · calidad · CI/CD · 18 módulos de aprendizaje</text>
  </g>

  <!-- flujo de datos animado -->
  <path id="track" d="M90 236 H1110" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <path class="wire" d="M90 236 H1110" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>

  <g class="t">
    <g class="node"><circle cx="110" cy="236" r="20" fill="#0c8599" stroke="#99e9f2" stroke-width="3"/></g>
    <text class="lbl" x="110" y="281" text-anchor="middle">LANDING</text>
    <g class="node n2"><circle cx="355" cy="236" r="20" fill="#a0522d" stroke="#f4d2b5" stroke-width="3"/></g>
    <text class="lbl" x="355" y="281" text-anchor="middle">BRONZE</text>
    <g class="node n3"><circle cx="600" cy="236" r="20" fill="#5c677d" stroke="#dde3ea" stroke-width="3"/></g>
    <text class="lbl" x="600" y="281" text-anchor="middle">SILVER</text>
    <g class="node n4"><circle cx="845" cy="236" r="20" fill="#b8860b" stroke="#ffe8a3" stroke-width="3"/></g>
    <text class="lbl" x="845" y="281" text-anchor="middle">GOLD</text>
    <g class="node n5"><circle cx="1090" cy="236" r="20" fill="#2f9e44" stroke="#b2f2bb" stroke-width="3"/></g>
    <text class="lbl" x="1090" y="281" text-anchor="middle">INSIGHTS</text>
  </g>

  <!-- "registros" viajando por el pipeline -->
  <circle r="7" fill="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#track"/></animateMotion></circle>
  <circle r="5" fill="#ffe8a3"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#track"/></animateMotion></circle>
  <circle r="5" fill="#99e9f2"><animateMotion dur="4s" repeatCount="indefinite" begin="1.3s"><mpath href="#track"/></animateMotion></circle>
  <circle r="5" fill="#ff8787"><animateMotion dur="4s" repeatCount="indefinite" begin="2.6s"><mpath href="#track"/></animateMotion></circle>

  <!-- capas medallion -->
  <g transform="translate(1010 40)">
    <rect class="in d1" x="0" y="0" width="120" height="26" rx="8" fill="#f5c542" opacity="0.95"/>
    <rect class="in d2" x="10" y="34" width="100" height="26" rx="8" fill="#c0c7d1" opacity="0.95"/>
    <rect class="in d3" x="20" y="68" width="80" height="26" rx="8" fill="#cd7f32" opacity="0.95"/>
  </g>
</svg>
